services:
  mysql:
    image: mysql:8.4
    container_name: student-information-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: student_information
      MYSQL_USER: student_app
      MYSQL_PASSWORD: StudentInfo@2026!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: